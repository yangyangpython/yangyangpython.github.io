<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>ConciseOS · 轻简操作系统</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(145deg, #f9fafc 0%, #f1f5f9 100%);
            font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1.5rem;
            scroll-behavior: smooth;
        }
        .glass-card {
            max-width: 1100px;
            width: 100%;
            background: rgba(255, 255, 255, 0.92);
            border-radius: 2rem;
            box-shadow: 0 20px 35px -12px rgba(0, 0, 0, 0.08), 0 1px 2px rgba(0, 0, 0, 0.02), inset 0 1px 0 rgba(255,255,255,0.6);
            padding: 2.5rem 2rem;
            transition: transform 0.25s ease, box-shadow 0.3s ease;
            border: 1px solid rgba(255,255,255,0.7);
        }
        .glass-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 28px 38px -14px rgba(0, 0, 0, 0.12);
        }
        .hero-title { text-align: center; margin-bottom: 2rem; }
        .hero-title h1 {
            font-size: 3.2rem;
            font-weight: 700;
            background: linear-gradient(135deg, #1E2B3C, #2C3E50);
            -webkit-background-clip: text;
            color: transparent;
            letter-spacing: -0.5px;
            margin-bottom: 0.5rem;
            animation: fadeSlideUp 0.7s cubic-bezier(0.2, 0.9, 0.4, 1.1) forwards;
            opacity: 0;
            transform: translateY(16px);
        }
        .hero-tag {
            font-size: 1.1rem;
            color: #5c6f87;
            font-weight: 450;
            background: rgba(100, 116, 139, 0.1);
            display: inline-block;
            padding: 0.2rem 1rem;
            border-radius: 40px;
            animation: fadeSlideUp 0.7s 0.1s forwards;
            opacity: 0;
            transform: translateY(12px);
        }
        .welcome-message { text-align: center; margin: 1rem 0 2rem 0; }
        .welcome-message p {
            font-size: 1.8rem;
            font-weight: 500;
            background: linear-gradient(120deg, #1f2a3e, #2d3e5a);
            -webkit-background-clip: text;
            color: transparent;
            letter-spacing: -0.3px;
            animation: glowFade 1s ease-out forwards;
            opacity: 0;
            animation-delay: 0.2s;
        }
        .button-group {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 1.8rem;
            margin: 2.5rem 0 1.2rem 0;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.65rem;
            padding: 0.9rem 2rem;
            font-size: 1.1rem;
            font-weight: 550;
            border-radius: 60px;
            background: white;
            color: #1e2f41;
            text-decoration: none;
            transition: all 0.25s ease;
            border: 1px solid #e2e8f0;
            box-shadow: 0 2px 6px rgba(0,0,0,0.02);
            cursor: pointer;
            letter-spacing: -0.2px;
            font-family: inherit;
        }
        .btn-primary {
            background: #ffffff;
            border-color: #cbd5e1;
            color: #1e293b;
        }
        .btn-primary i { color: #3b82f6; transition: transform 0.2s; }
        .btn-primary:hover {
            background: #f8fafc;
            border-color: #94a3b8;
            transform: translateY(-3px);
            box-shadow: 0 12px 20px -10px rgba(59,130,246,0.2);
        }
        .btn-secondary {
            background: #fefefe;
            border-color: #e2e8f0;
            color: #334155;
        }
        .btn-secondary i { color: #8b5cf6; }
        .btn-secondary:hover {
            background: #f5f3ff;
            border-color: #c4b5fd;
            transform: translateY(-3px);
            box-shadow: 0 12px 20px -10px rgba(139,92,246,0.15);
        }
        .btn-download {
            background: #eff6ff;
            border-color: #bfdbfe;
            color: #1e40af;
            font-weight: 600;
        }
        .btn-download i { color: #2563eb; }
        .btn-download:hover {
            background: #dbeafe;
            border-color: #93c5fd;
            transform: translateY(-3px);
            box-shadow: 0 12px 20px -12px #3b82f6;
        }
        .btn-pro {
            background: linear-gradient(105deg, #fff9e8, #ffefd6);
            border-color: #fbbf24;
            color: #b45309;
            font-weight: 700;
            box-shadow: 0 6px 14px rgba(245,158,11,0.15);
        }
        .btn-pro i { color: #f59e0b; }
        .btn-pro:hover {
            background: linear-gradient(105deg, #fff3e0, #ffe6c7);
            border-color: #f59e0b;
            transform: translateY(-3px);
            box-shadow: 0 16px 24px -12px #f59e0b;
        }
        .info-section {
            margin-top: 3rem;
            display: flex;
            flex-wrap: wrap;
            gap: 1.8rem;
            justify-content: center;
            border-top: 1px solid rgba(203, 213, 225, 0.5);
            padding-top: 2rem;
        }
        .info-card {
            flex: 1;
            min-width: 240px;
            background: rgba(255, 255, 255, 0.75);
            border-radius: 1.5rem;
            padding: 1.5rem 1rem;
            transition: all 0.2s ease-in-out;
            border: 1px solid rgba(226, 232, 240, 0.8);
            text-align: center;
            box-shadow: 0 3px 8px rgba(0,0,0,0.02);
        }
        .info-card:hover {
            transform: scale(1.01);
            background: rgba(255,255,255,0.9);
            border-color: #cbd5e1;
            box-shadow: 0 12px 22px -12px rgba(0,0,0,0.08);
        }
        .info-card i { font-size: 2.3rem; margin-bottom: 1rem; color: #3b82f6; }
        .info-card h3 { font-size: 1.5rem; font-weight: 600; margin-bottom: 0.75rem; color: #0f172a; }
        .info-card p { color: #334155; font-size: 0.95rem; line-height: 1.4; margin-top: 0.25rem; }
        .dev-signature { margin-top: 0.75rem; font-size: 0.9rem; color: #5b6e8c; font-weight: 500; }
        .download-note {
            background: #f1f5f9;
            border-radius: 2rem;
            padding: 0.5rem 1.2rem;
            display: inline-block;
            font-size: 0.85rem;
            margin-top: 1rem;
            color: #2c3e66;
        }
        @keyframes fadeSlideUp {
            0% { opacity: 0; transform: translateY(18px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        @keyframes glowFade {
            0% { opacity: 0; text-shadow: 0 0 0 rgba(100,108,255,0); }
            60% { opacity: 0.9; }
            100% { opacity: 1; text-shadow: 0 2px 6px rgba(0,0,0,0.02); }
        }
        .btn {
            animation: btnPop 0.45s cubic-bezier(0.2, 0.9, 0.4, 1.2) forwards;
            opacity: 0;
            transform: scale(0.96);
        }
        .btn:nth-child(1) { animation-delay: 0.2s; }
        .btn:nth-child(2) { animation-delay: 0.3s; }
        .btn:nth-child(3) { animation-delay: 0.4s; }
        .btn:nth-child(4) { animation-delay: 0.5s; }
        @keyframes btnPop {
            0% { opacity: 0; transform: scale(0.92); }
            100% { opacity: 1; transform: scale(1); }
        }
        @media (max-width: 680px) {
            .glass-card { padding: 1.8rem 1.2rem; }
            .hero-title h1 { font-size: 2.2rem; }
            .welcome-message p { font-size: 1.3rem; }
            .button-group { gap: 1rem; }
            .btn { padding: 0.7rem 1.4rem; font-size: 0.9rem; }
            .info-card h3 { font-size: 1.3rem; }
        }
        .toast-msg {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) scale(0.9);
            background: #1e293bdd;
            backdrop-filter: blur(12px);
            color: white;
            padding: 0.75rem 1.5rem;
            border-radius: 60px;
            font-size: 0.9rem;
            font-weight: 500;
            z-index: 999;
            opacity: 0;
            transition: opacity 0.2s ease, transform 0.2s;
            pointer-events: none;
            white-space: nowrap;
            font-family: monospace;
            letter-spacing: 0.3px;
            box-shadow: 0 10px 20px -5px rgba(0,0,0,0.2);
        }
        .toast-msg.show { opacity: 1; transform: translateX(-50%) scale(1); }
        footer { text-align: center; margin-top: 2rem; font-size: 0.75rem; color: #7f8c9a; }
        a { text-decoration: none; }

<!-- ===== 下载弹窗 ===== -->
<div class="cos-popup-overlay" id="cosDownloadPopup">
    <div class="cos-popup-box">
        <div class="cos-popup-icon">
            <i class="fas fa-cloud-download-alt"></i>
        </div>
        <div class="cos-popup-title">选择下载方式</div>
        <div class="cos-popup-subtitle">ConciseOS 安装包（约 55MB）</div>
        
        <div class="cos-popup-btn-group">
            <a href="https://conciseos.lanzouu.com/iBmcP412zsab" target="_blank" class="cos-popup-btn cos-popup-btn-primary">
                <i class="fas fa-hdd"></i>
                网盘源
                <span class="cos-popup-tag">推荐</span>
            </a>
            <a href="https://gh.api.99988866.xyz/https://github.com/yangyangpython/yangyangpython.github.io/releases/download/v1.0.0/main.exe" 
               target="_blank" class="cos-popup-btn cos-popup-btn-secondary">
                <i class="fas fa-bolt"></i>
                镜像源 A
            </a>
            <a href="https://github.moeyy.xyz/https://github.com/yangyangpython/yangyangpython.github.io/releases/download/v1.0.0/main.exe" 
               target="_blank" class="cos-popup-btn cos-popup-btn-secondary">
                <i class="fas fa-bolt"></i>
                镜像源 B
            </a>
        </div>
        
        <div class="cos-popup-note">
            <i class="fas fa-lock" style="font-size:0.7rem;"></i>
            网盘密码：COS &nbsp;|&nbsp; 
            <i class="fas fa-exclamation-circle" style="font-size:0.7rem;"></i>
            镜像不稳定可换源
        </div>
        
        <button class="cos-popup-btn cos-popup-btn-cancel" id="cosBtnCancel">
            取消
        </button>
    </div>
</div>

<script>
(function() {
    const toast = document.createElement('div');
    toast.className = 'toast-msg';
    document.body.appendChild(toast);

    function showMessage(msg, duration = 2200) {
        toast.textContent = msg;
        toast.classList.add('show');
        setTimeout(() => { toast.classList.remove('show'); }, duration);
    }

    const teamBtn = document.getElementById('infoTeamBtn');
    const aboutBtn = document.getElementById('aboutSoftwareBtn');
    const downloadBtn = document.getElementById('downloadBtn');
    const proBtn = document.getElementById('proBtn');

    if (teamBtn) {
        teamBtn.addEventListener('click', (e) => {
            e.preventDefault();
            showMessage('✨ 工作室: Conecise Studio · 开发者:张皓 开源贡献者们 ✨', 2500);
            const studioCard = document.getElementById('studioCard');
            if (studioCard) {
                studioCard.scrollIntoView({ behavior: 'smooth', block: 'center' });
                studioCard.style.transition = 'background 0.3s';
                studioCard.style.backgroundColor = '#eef2ff';
                setTimeout(() => { studioCard.style.backgroundColor = ''; }, 800);
            }
        });
    }

    if (aboutBtn) {
        aboutBtn.addEventListener('click', (e) => {
            e.preventDefault();
            showMessage('📖 ConciseOS — 基于Python3内核，专注简洁与高效。文档中心即将开放，敬请期待！', 2800);
            const aboutCard = document.getElementById('aboutCard');
            if (aboutCard) {
                aboutCard.scrollIntoView({ behavior: 'smooth', block: 'center' });
                aboutCard.style.transition = 'background 0.25s';
                aboutCard.style.backgroundColor = '#eef2ff';
                setTimeout(() => { aboutCard.style.backgroundColor = ''; }, 800);
            }
        });
    }

    // ===== 下载按钮：弹出选择框 =====
    const popup = document.getElementById('cosDownloadPopup');
    const btnCancel = document.getElementById('cosBtnCancel');

    if (downloadBtn) {
        downloadBtn.addEventListener('click', (e) => {
            e.preventDefault();
            popup.classList.add('active');
        });
    }

    if (btnCancel) {
        btnCancel.addEventListener('click', () => {
            popup.classList.remove('active');
        });
    }

    if (popup) {
        popup.addEventListener('click', (e) => {
            if (e.target === popup) {
                popup.classList.remove('active');
            }
        });
    }

    document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') {
            popup.classList.remove('active');
        }
    });
    // ==================================

    if (proBtn) {
        proBtn.addEventListener('click', () => {
            showMessage('✨ 跳转至 ConciseOS Pro 专属页面 ✨', 1200);
        });
    }

    const studioCardDiv = document.getElementById('studioCard');
    if (studioCardDiv) {
        studioCardDiv.style.cursor = 'pointer';
        studioCardDiv.addEventListener('click', () => {
            showMessage('👥 工作室成员: 创始人兼核心开发者 张皓', 2000);
        });
    }
    const aboutCardDiv = document.getElementById('aboutCard');
    if (aboutCardDiv) {
        aboutCardDiv.style.cursor = 'pointer';
        aboutCardDiv.addEventListener('click', () => {
            showMessage('🔍 ConciseOS 特色: 无广告/ 秒级启动 / 优雅的圆角设计 & 原生Wayland支持', 2400);
        });
    }
    const downloadInfoDiv = document.getElementById('downloadInfoCard');
    if (downloadInfoDiv) {
        downloadInfoDiv.style.cursor = 'pointer';
        downloadInfoDiv.addEventListener('click', () => {
            showMessage('📀 下载前请记住密码: COS', 2300);
        });
    }

    const allInfoCards = document.querySelectorAll('.info-card');
    allInfoCards.forEach(card => {
        card.addEventListener('mouseenter', () => { card.style.transition = 'all 0.2s'; });
    });
})();
</script>
</body>
</html>
